# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "week02" ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    env:
      IMAGE_NAME: cs6620-app

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Lint with flake8
      run: |
        pip install flake8
        flake8 .
      continue-on-error: true   # This line ensures the workflow doesn't block on lint errors

    - name: Test with pytest
      run: |
        pip install pytest
        pytest
      continue-on-error: true   # This line ensures the workflow doesn't block on test errors

    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Guard: assert DockerHub secrets exist
      run: |
        [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ] || { echo "DOCKERHUB_USERNAME is empty"; exit 1; }
        [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]    || { echo "DOCKERHUB_TOKEN is empty"; exit 1; }

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        push: true
        tags: |
          docker.io/${{ secrets.DOCKERHUB_USERNAME }}/cs6620-app:latest
          docker.io/${{ secrets.DOCKERHUB_USERNAME }}/cs6620-app:${{ github.sha }}
        labels: |
          org.opencontainers.image.source=${{ github.event.repository.html_url }}
          org.opencontainers.image.revision=${{ github.sha }}
          build.source=github-actions
          build.workflow=${{ github.workflow }}
          build.run_id=${{ github.run_id }}
          build.run_number=${{ github.run_number }}
