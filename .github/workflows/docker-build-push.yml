name: Debug Secrets

on:
  push:
    branches: [ "week02" ]

jobs:
  debug:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Debug - Check secrets availability
      run: |
        echo "Checking if secrets are available..."
        
        # Check DOCKERHUB_USERNAME
        if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ]; then
          echo "✅ DOCKERHUB_USERNAME is set"
          echo "Username length: ${#USERNAME}"
          # Print first and last character only for verification
          USERNAME="${{ secrets.DOCKERHUB_USERNAME }}"
          echo "Username starts with: ${USERNAME:0:1}"
          echo "Username ends with: ${USERNAME: -1}"
        else
          echo "❌ DOCKERHUB_USERNAME is NOT set or empty"
        fi
        
        # Check DOCKERHUB_TOKEN
        if [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
          echo "✅ DOCKERHUB_TOKEN is set"
          TOKEN="${{ secrets.DOCKERHUB_TOKEN }}"
          echo "Token length: ${#TOKEN}"
        else
          echo "❌ DOCKERHUB_TOKEN is NOT set or empty"
        fi
    
    - name: Test manual Docker login
      run: |
        if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ] && [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
          echo "Attempting manual Docker login..."
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login docker.io -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
          if [ $? -eq 0 ]; then
            echo "✅ Manual login successful"
            docker logout
          else
            echo "❌ Manual login failed"
          fi
        else
          echo "⚠️ Skipping login test - secrets not available"
        fi
    
    - name: List all available contexts
      run: |
        echo "GitHub context info:"
        echo "Repository: ${{ github.repository }}"
        echo "Repository owner: ${{ github.repository_owner }}"
        echo "Actor: ${{ github.actor }}"
        echo "Event name: ${{ github.event_name }}"
        echo "Ref: ${{ github.ref }}"
        echo "SHA: ${{ github.sha }}"